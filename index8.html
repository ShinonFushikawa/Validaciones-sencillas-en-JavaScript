<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background:#f5f7fa;
            font-size:18px;
        }

        .hero{
            background:#0d6efd;
            color:white;
            padding:35px 20px;
            border-bottom-left-radius:25px;
            border-bottom-right-radius:25px;
            text-align:center;
        }

        .option-card{
            background:white;
            border-radius:20px;
            padding:20px;
            margin-bottom:20px;
            border:1px solid #dee2e6;
        }

        .option-icon{
            font-size:2.2rem;
            width:60px;
            text-align:center;
        }
    </style>
</head>

<body>

<header class="hero">
    <i class="bi bi-file-earmark-text-fill display-3"></i>
    <h1 class="h3 mt-3">Documentos</h1>
    <p>Seleccione el documento que desea consultar</p>
</header>

<main class="container mt-4">

    <a href="#" class="text-decoration-none text-dark">
        <div class="option-card d-flex align-items-center">
            <div class="option-icon text-primary">
                <i class="bi bi-file-medical-fill"></i>
            </div>

            <div class="ms-3">
                <h2 class="h5 mb-1">Indicaciones médicas</h2>
                <p class="mb-0 text-muted">Recomendaciones para el paciente.</p>
            </div>
        </div>
    </a>

    <a href="#" class="text-decoration-none text-dark">
        <div class="option-card d-flex align-items-center">
            <div class="option-icon text-success">
                <i class="bi bi-hospital"></i>
            </div>

            <div class="ms-3">
                <h2 class="h5 mb-1">Preparación para estudios</h2>
                <p class="mb-0 text-muted">Información antes de realizar un estudio.</p>
            </div>
        </div>
    </a>

    <a href="#" class="text-decoration-none text-dark">
        <div class="option-card d-flex align-items-center">
            <div class="option-icon text-warning">
                <i class="bi bi-clock-fill"></i>
            </div>

            <div class="ms-3">
                <h2 class="h5 mb-1">Horarios y contacto</h2>
                <p class="mb-0 text-muted">Ubicación y teléfonos del hospital.</p>
            </div>
        </div>
    </a>

    <a href="index.html" class="btn btn-primary btn-lg w-100 mt-3">
        <i class="bi bi-arrow-left"></i> Volver al inicio
    </a>

</main>

</body>
</html>
